<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rhythmix – Music Player</title>
  <meta name="description" content="A premium music player with playlist, autoplay, progress bar and volume control." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Animated background orbs -->
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>

  <div class="app-wrapper">

    <!-- ===== PLAYER CARD ===== -->
    <div class="player-card">

      <!-- Header -->
      <div class="player-header">
        <span class="logo">🎵 Rhythmix</span>
        <div class="header-actions">
          <button class="icon-btn" id="shuffleBtn" title="Shuffle" aria-label="Shuffle">
            <svg viewBox="0 0 24 24">
              <path
                d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04z" />
            </svg>
          </button>
          <button class="icon-btn" id="repeatBtn" title="Repeat" aria-label="Repeat">
            <svg viewBox="0 0 24 24">
              <path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Album Art -->
      <div class="album-art-wrapper">
        <div class="album-art" id="albumArt">
          <div class="disc-ring"></div>
          <div class="disc-center" id="discCenter">
            <span class="emoji-art" id="albumEmoji">🎸</span>
          </div>
        </div>
        <div class="album-glow" id="albumGlow"></div>
      </div>

      <!-- Track Info -->
      <div class="track-info">
        <h1 class="track-title" id="trackTitle">Neon Dreams</h1>
        <p class="track-artist" id="trackArtist">The Electric Waves</p>
        <div class="track-meta">
          <span class="badge" id="genreBadge">Synthwave</span>
          <span class="time-display">
            <span id="currentTime">0:00</span> / <span id="totalTime">0:00</span>
          </span>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="progress-section">
        <div class="progress-bar-track" id="progressTrack">
          <div class="progress-bar-fill" id="progressFill"></div>
          <div class="progress-thumb" id="progressThumb"></div>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="ctrl-btn prev-btn" id="prevBtn" aria-label="Previous">
          <svg viewBox="0 0 24 24">
            <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" />
          </svg>
        </button>
        <button class="ctrl-btn play-btn" id="playBtn" aria-label="Play/Pause">
          <svg class="icon-play" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z" />
          </svg>
          <svg class="icon-pause hidden" viewBox="0 0 24 24">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
          </svg>
        </button>
        <button class="ctrl-btn next-btn" id="nextBtn" aria-label="Next">
          <svg viewBox="0 0 24 24">
            <path d="M6 18l8.5-6L6 6v12zm2.5-6 6-4.25v8.5L8.5 12zM16 6h2v12h-2z" />
          </svg>
        </button>
      </div>

      <!-- Volume -->
      <div class="volume-section">
        <button class="icon-btn vol-icon" id="muteBtn" aria-label="Mute">
          <svg id="volIcon" viewBox="0 0 24 24">
            <path
              d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
          </svg>
        </button>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="80" aria-label="Volume" />
        <span class="vol-pct" id="volPct">80%</span>
      </div>

    </div>

    <!-- ===== PLAYLIST ===== -->
    <div class="playlist-card">
      <div class="playlist-header">
        <h2>Playlist</h2>
        <span class="track-count" id="trackCount">4 tracks</span>
      </div>
      <ul class="playlist" id="playlist" role="list"></ul>
    </div>

  </div>

  <!-- Hidden audio element -->
  <audio id="audioPlayer"></audio>

  <script src="script.js"></script>
</body>

</html>
