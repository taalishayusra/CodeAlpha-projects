<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Image Gallery</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #ededed;
            color: #222;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 35px;
        }

        .filters {
            text-align: center;
            margin-bottom: 30px;
        }

        .filters button {
            border: none;
            padding: 12px 22px;
            margin: 5px;
            border-radius: 25px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        .filters button:hover,
        .filters button.active {
            background: #ff5722;
            transform: translateY(-2px);
        }

        .gallery {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease, filter 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
            filter: brightness(70%);
        }

        .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            color: white;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            opacity: 0;
            transition: 0.4s;
        }

        .gallery-item:hover .caption {
            opacity: 1;
        }

        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .lightbox img {
            max-width: 80%;
            max-height: 80%;
            border-radius: 10px;
            animation: zoomIn 0.4s ease;
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.5);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            font-size: 50px;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .close:hover {
            color: #ff5722;
            transform: rotate(90deg);
        }

        .prev,
        .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgb(14, 7, 235);
            border: none;
            color: white;
            font-size: 40px;
            padding: 15px 20px;
            cursor: pointer;
            border-radius: 50%;
            transition: 0.3s;
        }

        .prev:hover,
        .next:hover {
            background: #ff5722;
        }

        .prev {
            left: 30px;
        }

        .next {
            right: 30px;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px;
            }

            h1 {
                font-size: 28px;
            }

            .gallery {
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                gap: 15px;
            }

            .gallery-item img {
                height: 200px;
            }

            .prev,
            .next {
                font-size: 25px;
                padding: 10px 15px;
            }

            .prev {
                left: 10px;
            }

            .next {
                right: 10px;
            }

            .lightbox img {
                max-width: 90%;
            }
        }

        @media (max-width: 480px) {
            .filters button {
                padding: 9px 15px;
                font-size: 13px;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery-item img {
                height: 250px;
            }

            .close {
                font-size: 40px;
                right: 20px;
            }
        }

        .mouse-ball {
            position: fixed;
            width: 8px;
            height: 8px;
            background: #ff5722;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #ff5722;
            transition: left 0.15s ease, top 0.15s ease;
            opacity: 0.8;
        }

    </style>
</head>

<body>

    <h1>My Image Gallery</h1>

    <div class="filters">
        <button class="active" data-filter="all">All</button>
        <button data-filter="nature">Nature</button>
        <button data-filter="city">City</button>
        <button data-filter="animals">Animals</button>
    </div>

    <div class="gallery">

        <div class="gallery-item nature">
            <img src="https://picsum.photos/id/1018/800/600" alt="Nature">
            <div class="caption">Beautiful Nature</div>
        </div>

        <div class="gallery-item city">
            <img src="https://picsum.photos/id/1011/800/600" alt="City">
            <div class="caption">City View</div>
        </div>

        <div class="gallery-item animals">
            <img src="https://picsum.photos/id/1025/800/600" alt="Dog">
            <div class="caption">Cute Animal</div>
        </div>

        <div class="gallery-item nature">
            <img src="https://picsum.photos/id/1039/800/600" alt="Mountain">
            <div class="caption">Mountain Landscape</div>
        </div>

        <div class="gallery-item city">
            <img src="https://picsum.photos/id/1043/800/600" alt="City">
            <div class="caption">Modern City</div>
        </div>

        <div class="gallery-item animals">
            <img src="https://picsum.photos/id/237/800/600" alt="Dog">
            <div class="caption">Friendly Dog</div>
        </div>

        <div class="gallery-item nature">
            <img src="https://picsum.photos/id/1050/800/600" alt="Forest">
            <div class="caption">Green Forest</div>
        </div>

        <div class="gallery-item city">
            <img src="https://picsum.photos/id/1060/800/600" alt="Building">
            <div class="caption">City Architecture</div>
        </div>

        <div class="gallery-item animals">
            <img src="https://picsum.photos/id/1074/800/600" alt="Animal">
            <div class="caption">Wild Animal</div>
        </div>

    </div>

    <div class="lightbox" id="lightbox">
        <span class="close" id="close">&times;</span>
        <button class="prev" id="prev">&#10094;</button>
        <img id="lightboxImage" src="" alt="">
        <button class="next" id="next">&#10095;</button>
    </div>

    <script>
        const images = document.querySelectorAll(".gallery-item img");
        const lightbox = document.getElementById("lightbox");
        const lightboxImage = document.getElementById("lightboxImage");
        const close = document.getElementById("close");
        const next = document.getElementById("next");
        const prev = document.getElementById("prev");

        let currentIndex = 0;

        images.forEach((image, index) => {
            image.addEventListener("click", () => {
                currentIndex = index;
                showImage();
                lightbox.style.display = "flex";
            });
        });

        function showImage() {
            lightboxImage.src = images[currentIndex].src;
            lightboxImage.alt = images[currentIndex].alt;
        }

        next.addEventListener("click", (event) => {
            event.stopPropagation();
            currentIndex++;
            if (currentIndex >= images.length) currentIndex = 0;
            showImage();
        });

        prev.addEventListener("click", (event) => {
            event.stopPropagation();
            currentIndex--;
            if (currentIndex < 0) currentIndex = images.length - 1;
            showImage();
        });

        close.addEventListener("click", () => {
            lightbox.style.display = "none";
        });

        lightbox.addEventListener("click", (event) => {
            if (event.target === lightbox) {
                lightbox.style.display = "none";
            }
        });

        document.addEventListener("keydown", (event) => {
            if (lightbox.style.display === "flex") {
                if (event.key === "ArrowRight") {
                    currentIndex++;
                    if (currentIndex >= images.length) currentIndex = 0;
                    showImage();
                }

                if (event.key === "ArrowLeft") {
                    currentIndex--;
                    if (currentIndex < 0) currentIndex = images.length - 1;
                    showImage();
                }

                if (event.key === "Escape") {
                    lightbox.style.display = "none";
                }
            }
        });

        const filterButtons = document.querySelectorAll(".filters button");
        const galleryItems = document.querySelectorAll(".gallery-item");

        filterButtons.forEach(button => {
            button.addEventListener("click", () => {
                filterButtons.forEach(btn => btn.classList.remove("active"));
                button.classList.add("active");

                const filter = button.getAttribute("data-filter");

                galleryItems.forEach(item => {
                    if (filter === "all" || item.classList.contains(filter)) {
                        item.style.display = "block";
                    } else {
                        item.style.display = "none";
                    }
                });
            });
        });

        const numberOfBalls = 30;
        const balls = [];

        for (let i = 0; i < numberOfBalls; i++) {
            const ball = document.createElement("div");
            ball.classList.add("mouse-ball");
            document.body.appendChild(ball);
            balls.push({ element: ball, x: 0, y: 0 });
        }

        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener("mousemove", (event) => {
            mouseX = event.clientX;
            mouseY = event.clientY;
        });

        function animateBalls() {
            let x = mouseX;
            let y = mouseY;

            balls.forEach((ball) => {
                ball.x += (x - ball.x) * 0.25;
                ball.y += (y - ball.y) * 0.25;

                ball.element.style.left = ball.x + "px";
                ball.element.style.top = ball.y + "px";

                x = ball.x;
                y = ball.y;
            });

            requestAnimationFrame(animateBalls);
        }

        animateBalls();
    </script>

</body>
</html>
